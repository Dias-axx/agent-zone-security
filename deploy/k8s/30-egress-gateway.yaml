# Egress gateway: a TLS-terminating forward proxy (mitmproxy + this repo's own
# control.policy_engine, see deploy/mitmproxy/) that agent-restricted and
# deploy-staging are allowed to reach and nothing else is (see
# 31-allow-egress-gateway.yaml). It enforces the same egress allowlist as
# control/policy_engine.py's evaluate_egress, not a reimplementation — see
# deploy/mitmproxy/policy_addon.py and docs/adr/0002-tls-terminating-egress-gateway.md.
#
# Build and push deploy/mitmproxy/Dockerfile before applying this manifest;
# replace `image:` below with wherever you pushed it. This has not been
# deployed against a live cluster — see docs/architecture.md and
# docs/live-verification-runbook.md.
#
# Known limitation even once live: the mitmproxy CA is generated on first
# container start into an emptyDir, so it rotates on every pod restart.
# Distributing that CA to agent pods' trust stores is a manual step for now
# (see the ADR) — this manifest proves the proxy topology, real-policy
# enforcement, and audit-log integration; it does not automate CA trust
# distribution.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-gateway
  namespace: egress-gateway
  labels:
    app: egress-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-gateway
  template:
    metadata:
      labels:
        app: egress-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-gateway
          image: ghcr.io/dias-axx/agent-zone-control-egress-gateway:latest # nach `make egress-gateway-image` ersetzen
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mitmproxy-confdir
              mountPath: /home/mitmproxy/.mitmproxy
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mitmproxy-confdir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-gateway
  namespace: egress-gateway
spec:
  selector:
    app: egress-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: egress-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-agent-zones
  namespace: egress-gateway
spec:
  podSelector:
    matchLabels:
      app: egress-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: agent-restricted
        - namespaceSelector:
            matchLabels:
              zone: deploy-staging
      ports:
        - protocol: TCP
          port: 8080
